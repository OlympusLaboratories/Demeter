name: Profile Drift

on:
  pull_request:
    paths:
      - 'profiles/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check profile drift
        run: python3 profiles/check-transform.py check --summary "$GITHUB_STEP_SUMMARY"
