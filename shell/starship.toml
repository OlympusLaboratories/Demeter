format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$nodejs\
$character"""

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = "py "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = "go "
format = '[$symbol($version )]($style)'

[nodejs]
symbol = "node "
format = '[$symbol($version )]($style)'

[docker_context]
symbol = "docker "
format = '[$symbol$context]($style) '
